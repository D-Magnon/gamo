<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memento</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&family=VT323&display=swap');

    body {
      position: fixed;
      background: black;
      justify-content: center;
      align-items: center;
    }
    
    .square {
      z-index: 2;
      position: absolute;
      width: 4vh;
      height: 4vh;
      background: white;
      left: 49vw;
      top: 50vh;
    }
    
    .worldmap {
      z-index: 1;
      position: absolute;
      background: #d6a14b;
      width: 3000px;
      height: 3000px;
    }
    
    .block {
      z-index: 1;
      position: absolute;
      background: green;
      width: 20px;
      height: 20px;
      top: 60%;
      left: 50%;
    }
    
    .block2 {
      z-index: 1;
      position: absolute;
      background: green;
      width: 20px;
      height: 20px;
      top: 100px;
      left: 300px;
    }

    .btnup {
      z-index: 10;
      position: absolute;
      width: 45.5vw;
      height: 42vh;
      left: 27vw;
    }
    
    .btndown {
      z-index: 10;
      position: absolute;
      width: 45.5vw;
      height: 42vh;
      top: 60vh;
      left: 27vw;
    }
    
    .btnright {
      z-index: 10;
      position: absolute;
      width: 26.5vw;
      height: 45vh;
      top: 27vh;
      left: 73vw;
    }
    
    .btnleft {
      z-index: 10;
      position: absolute;
      width: 26.5vw;
      height: 45vh;
      top: 27vh;
    }
   
    .btnUPleft {
      z-index: 10;
      position: absolute;
      width: 26.5vw;
      height: 27vh;
    }
   
    .btnDOWNleft {
      z-index: 10;
      position: absolute;
      width: 26.5vw;
      height: 27vh;
      top: 72vh;
      left: 0.0005vw;
    }
   
    .btnUPright {
      z-index: 10;
      position: absolute;
      width: 26.5vw;
      height: 27vh;
      top: 0.005vh;
      left: 73vw;
    }
   
    .btnDOWNright {
      z-index: 10;
      position: absolute;
      width: 26.5vw;
      height: 27vh;
      top: 72vh;
      left: 73vw;
    }
    
  </style>
  
</head>

<body>
  
  <div class="square" id="squarey"></div>
  <div class="btnup" id="W"></div>
  <div class="btnleft" id="A"></div>
  <div class="btndown" id="S"></div>
  <div class="btnright" id="D"></div>
  <div class="btnUPleft" id="WA"></div>
  <div class="btnUPright" id="WD"></div>
  <div class="btnDOWNleft" id="SA"></div>
  <div class="btnDOWNright" id="SD"></div>
  <div class="worldmap" id="map">
  <div class="block"></div>
  <div class="block2"></div>
  </div>
  <script>
  
  let W = document.getElementById("W");
  let A = document.getElementById("A");
  let S = document.getElementById("S");
  let D = document.getElementById("D");
  let WA = document.getElementById("WA");
  let WD = document.getElementById("WD");
  let SA = document.getElementById("SA");
  let SD = document.getElementById("SD");
  
  let squarey = document.getElementById("squarey");
  let map = document.getElementById("map");
  
    let movingup = false;
    let movingdown = false;
    let movingright = false;
    let movingleft = false;
    let mapX = -((3000 - window.innerWidth))/2;
    let mapY = -(3000 - window.innerHeight);
    
    function worldLoop() {
      requestAnimationFrame(worldLoop); 
      if (movingup === true) { mapY = mapY + 1; }
      if (movingdown === true) { mapY = mapY - 1; }
      if (movingright === true) { mapX = mapX - 1; }
      if (movingleft === true) { mapX = mapX + 1; }
      map.style.left = `${mapX}px`;
      map.style.top = `${mapY}px`;
    }
    worldLoop();
    
         W.addEventListener("pointerdown", function() {
           movingup = true;
         });
         W.addEventListener("pointerup", function() {
           movingup = false;
         });
         W.addEventListener("pointerleave", function() {
           movingup = false;
         });
         W.addEventListener("pointercancel", function() {
           movingup = false;
         });
         A.addEventListener("pointerdown", function() {
           movingleft = true;
         });  
         A.addEventListener("pointerup", function() {
           movingleft = false;  
         });
         A.addEventListener("pointerleave", function() {
           movingleft = false;
         });
         A.addEventListener("pointercancel", function() {
           movingleft = false;
         });
         S.addEventListener("pointerdown", function() {
           movingdown = true;
         });
         S.addEventListener("pointerup", function() {
           movingdown = false;
         });
         S.addEventListener("pointerleave", function() {
           movingdown = false;
         });
         S.addEventListener("pointercancel", function() {
           movingdown = false;
         });
         D.addEventListener("pointerdown", function() {
           movingright = true;
         });
         D.addEventListener("pointerup", function() {
           movingright = false;
         });
         D.addEventListener("pointerleave", function() {
           movingright = false;
         });
         D.addEventListener("pointercancel", function() {
           movingright = false;
         });
         WA.addEventListener("pointerdown", function() {
          movingup = true;
          movingleft = true;
         });
         WA.addEventListener("pointerup", function() {
           movingup = false;
           movingleft = false;
         });
         WA.addEventListener("pointerleave", function() {
           movingup = false;
           movingleft = false;
         });
         WA.addEventListener("pointercancel", function() {
           movingup = false;
           movingleft = false;
         });
         WD.addEventListener("pointerdown", function() {
           movingup = true;
           movingright = true;
         });
         WD.addEventListener("pointerup", function() {
           movingup = false;
           movingright = false;
         });
         WD.addEventListener("pointerleave", function() {
           movingup = false;
           movingright = false;
         });
         WD.addEventListener("pointercancel", function() {
           movingup = false;
           movingright = false;
         });
         SA.addEventListener("pointerdown", function() {
           movingdown = true;
           movingleft = true;
         });
         SA.addEventListener("pointerup", function() {
           movingdown = false;
           movingleft = false;
         });
         SA.addEventListener("pointerleave", function() {
           movingdown = false;
           movingleft = false;
         });
         SA.addEventListener("pointercancel", function() {
           movingdown = false;
           movingleft = false;
         });
         SD.addEventListener("pointerdown", function() {
           movingdown = true;
           movingright = true;
         });
         SD.addEventListener("pointerup", function() {
           movingdown = false;
           movingright = false;
         });
         SD.addEventListener("pointerleave", function() {
           movingdown = false;
           movingright = false;
         });
         SD.addEventListener("pointercancel", function() {
           movingdown = false;
           movingright = false;
         });
         
    document.addEventListener("keydown", function(event) {
      if(event.key === "ArrowUp" || event.key === "w") {movingup = true; }
      if(event.key === "ArrowDown" || event.key === "s") {movingdown = true; }
      if(event.key === "ArrowRight" || event.key === "d") {movingright = true; }
      if(event.key === "ArrowLeft" || event.key === "a") {movingleft = true; }
    });
    document.addEventListener("keyup", function(notevent) {
      if(notevent.key === "ArrowUp" || notevent.key === "w") {movingup = false; }
      if(notevent.key === "ArrowDown" || notevent.key === "s") {movingdown = false; }
      if(notevent.key === "ArrowRight" || notevent.key === "d") {movingright = false; }
      if(notevent.key === "ArrowLeft" || notevent.key === "a") {movingleft = false; }
    });
    
  </script>
</body>

</html>
