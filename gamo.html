<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memento</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&family=VT323&display=swap');

    body {
      position: fixed;
      background: black;
      justify-content: center;
      align-items: center;
    }
    
    .square {
      position: absolute;
      width: 2vw;
      height: 3vh;
      background: white;
      left: 50vw;
      top: 50vh;
    }
    
    .btnup {
      position: absolute;
      width: 45.5vw;
      height: 42vh;
      left: 27vw;
    }
    
    .btndown {
      position: absolute;
      width: 45.5vw;
      height: 42vh;
      top: 60vh;
      left: 27vw;
    }
    
    .btnright {
      position: absolute;
      width: 26.5vw;
      height: 45vh;
      top: 27vh;
      left: 73vw;
    }
    
    .btnleft {
    position: absolute;
    width: 26.5vw;
    height: 45vh;
    top: 27vh;
    }
   
   .btnUPleft {
     position: absolute;
     width: 26.5vw;
     height: 27vh;
   }
   
   .btnDOWNleft {
     position: absolute;
     width: 26.5vw;
     height: 27vh;
     top: 72vh;
     left: 0.0005vw;
    }
   
   .btnUPright {
     position: absolute;
     width: 26.5vw;
     height: 27vh;
     top: 0.005vh;
     left: 73vw;
   }
   
   .btnDOWNright {
     position: absolute;
     width: 26.5vw;
     height: 27vh;
     top: 72vh;
     left: 73vw;
   }
  </style>
  
</head>

<body>
  
  <div class="square" id="squarey"></div>
  <div class="btnup" id="W"></div>
  <div class="btnleft" id="A"></div>
  <div class="btndown" id="S"></div>
  <div class="btnright" id="D"></div>
  <div class="btnUPleft" id="WA"></div>
  <div class="btnUPright" id="WD"></div>
  <div class="btnDOWNleft" id="SA"></div>
  <div class="btnDOWNright" id="SD"></div>
  <div class="camera-viewport"></div>
  
  <script>
  let W = document.getElementById("W");
  let A = document.getElementById("A");
  let S = document.getElementById("S");
  let D = document.getElementById("D");
  let WA = document.getElementById("WA");
  let WD = document.getElementById("WD");
  let SA = document.getElementById("SA");
  let SD = document.getElementById("SD");
  let squarey = document.getElementById("squarey");
  
    let movingup = false;
    let movingdown = false;
    let movingright = false;
    let movingleft = false;
    let x = 750;
    let y = 500;
    
    function gameLoop() {
      requestAnimationFrame(gameLoop);
      if (movingup === true) { y = y - 2; }
      if (movingdown === true) { y = y + 2; }
      if (movingright === true) { x = x + 2; }
      if (movingleft === true) { x = x - 2; }
      squarey.style.left = `${x}px`;
      squarey.style.top = `${y}px`;
    }
    gameLoop();
    
         W.addEventListener("pointerdown", function() {
           movingup = true;
         });
         W.addEventListener("pointerup", function() {
           movingup = false;
         });
         A.addEventListener("pointerdown", function() {
           movingleft = true;
         });  
         A.addEventListener("pointerup", function() {
           movingleft = false;  
         });
         S.addEventListener("pointerdown", function() {
           movingdown = true;
         });
         S.addEventListener("pointerup", function() {
           movingdown = false;
         });
         D.addEventListener("pointerdown", function() {
           movingright = true;
         });
         D.addEventListener("pointerup", function() {
           movingright = false;
         });
         WA.addEventListener("pointerdown", function() {
          movingup = true;
          movingleft = true;
         });
         WA.addEventListener("pointerup", function() {
           movingup = false;
           movingleft = false;
         });
         WD.addEventListener("pointerdown", function() {
           movingup = true;
           movingright = true;
         });
         WD.addEventListener("pointerup", function() {
           movingup = false;
           movingright = false;
         });
         SA.addEventListener("pointerdown", function() {
           movingdown = true;
           movingleft = true;
         });
         SA.addEventListener("pointerup", function() {
           movingdown = false;
           movingleft = false;
         });
         SD.addEventListener("pointerdown", function() {
           movingdown = true;
           movingright = true;
         });
         SD.addEventListener("pointerup", function() {
           movingdown = false;
           movingright = false;
         });
         
    document.addEventListener("keydown", function(event) {
      if(event.key === "ArrowUp" || event.key === "w") {movingup = true; }
      if(event.key === "ArrowDown" || event.key === "s") {movingdown = true; }
      if(event.key === "ArrowRight" || event.key === "d") {movingright = true; }
      if(event.key === "ArrowLeft" || event.key === "a") {movingleft = true; }
    });
    document.addEventListener("keyup", function(notevent) {
      if(notevent.key === "ArrowUp" || notevent.key === "w") {movingup = false; }
      if(notevent.key === "ArrowDown" || notevent.key === "s") {movingdown = false; }
      if(notevent.key === "ArrowRight" || notevent.key === "d") {movingright = false; }
      if(notevent.key === "ArrowLeft" || notevent.key === "a") {movingleft = false; }
    });
    
  </script>
</body>

</html>
